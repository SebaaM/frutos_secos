      - EN_REPARTO
      - TERMINADO
      - CANCELADO
      - VENCIDO
      type: string
      description: |-
        * `A_CONFIRMAR` - A confirmar
        * `RESERVADO` - Reservado
        * `PREPARANDO` - Preparando
        * `LISTO_PARA_RETIRO` - Listo para retirar
        * `EN_REPARTO` - En reparto
        * `TERMINADO` - Terminado
        * `CANCELADO` - Cancelado
        * `VENCIDO` - Vencido
