          description: ''
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    type: string
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/orders/{id}/:
    get:
      operationId: v1_orders_retrieve
      description: Otro cliente recibe 404. Ni email ni referencia sirven como credenciales.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
