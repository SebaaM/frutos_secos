  /api/v1/backoffice/variants/{id}/adjust-stock/:
    post:
      operationId: v1_backoffice_variants_adjust_stock_create
      description: |-
        Requiere DEBUG y BACKOFFICE_ENABLED, conexión loopback y Origin permitido si está presente. Requiere una sesión de operador activo y X-CSRFToken para escrituras.

        delta entero distinto de 0; reason obligatorio; expected_stock es el físico observado. Si cambió, responde 409. Transacción con bloqueo de filas y movimiento auditado. No modifica reservado ni permite físico negativo o menor al reservado. Disponible = físico − reservado. Cantidades en paquetes, no gramos.
      summary: Ajustar stock físico con auditoría
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este product variant.
        required: true
      tags:
      - Backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
            examples:
              IngresoDeCincoPaquetes:
                value:
                  delta: 5
                  reason: Reposición
                  expected_stock: 10
                summary: Ingreso de cinco paquetes
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    type: string
          description: 'Validación: errores por campo, non_field_errors o lista de
            mensajes.'
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: 'Acceso bloqueado: entorno, IP u origen no permitido.'
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: El recurso no existe.
        '409':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: expected_stock no coincide con el stock físico actual. Actualizar
            y reintentar.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVariant'
          description: ''
