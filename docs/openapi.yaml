        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
        delivery:
          allOf:
          - $ref: '#/components/schemas/DeliveryEnum'
          readOnly: true
        address:
          type: string
          readOnly: true
        address_help:
          type: string
          readOnly: true
        status:
