    post:
      operationId: v1_orders_create
      description: Crea A_CONFIRMAR sin reserva. Precios y total validados en servidor.
        Reintentos con el mismo idempotency_key y datos devuelven el mismo pedido.
        Requiere CSRF; no envía WhatsApp automáticamente.
      tags:
      - Pedidos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInputRequest'
          application/x-www-form-urlencoded:
