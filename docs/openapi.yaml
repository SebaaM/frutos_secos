              $ref: '#/components/schemas/OrderInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderInputRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
