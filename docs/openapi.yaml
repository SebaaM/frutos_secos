          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductInputRequest'
      security:
      - cookieAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    type: string
          description: 'Validación: errores por campo, non_field_errors o lista de
            mensajes.'
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                - detail
          description: 'Acceso bloqueado: entorno, IP u origen no permitido.'
        '404':
          content:
