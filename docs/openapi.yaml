              schema:
                $ref: '#/components/schemas/Message'
          description: ''
components:
  schemas:
    AdminCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
      required:
      - id
      - name
      - slug
    AdminCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
      required:
      - name
      - slug
    AdminOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
        delivery:
          allOf:
          - $ref: '#/components/schemas/DeliveryEnum'
          readOnly: true
        address:
          type: string
          readOnly: true
        address_help:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        reserved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reservation_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/OrderEvent'
          readOnly: true
        internal_note:
          type: string
          readOnly: true
      required:
      - address
      - address_help
      - created_at
      - delivery
      - email
      - events
      - id
      - internal_note
      - lines
      - name
      - phone
      - reference
      - reservation_expires_at
      - reserved_at
      - status
      - status_label
      - subtotal
      - updated_at
    AdminProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          type: integer
        description:
          type: string
        ingredients:
          type: string
        allergen_info:
          type: string
        storage_instructions:
          type: string
        is_published:
          type: boolean
        is_featured:
          type: boolean
        variants:
          type: array
          items:
            $ref: '#/components/schemas/AdminVariant'
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - id
      - images
      - name
      - slug
      - updated_at
      - variants
    AdminVariant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sku:
          type: string
          readOnly: true
        weight_grams:
          type: integer
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        stock_physical:
          type: integer
          readOnly: true
        stock_reserved:
          type: integer
          readOnly: true
        stock_available:
          type: integer
          readOnly: true
      required:
      - id
      - is_active
      - price
      - sku
      - stock_available
      - stock_physical
      - stock_reserved
      - weight_grams
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    CustomerIdentity:
      type: object
      properties:
        email:
          type: string
          format: email
