      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    ImageInputRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
        image_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        alt_text:
          type: string
          minLength: 1
          maxLength: 255
        credit:
          type: string
          maxLength: 160
      required:
